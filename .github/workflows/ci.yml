name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Community / ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Ubuntu
            os: ubuntu-latest
          - os-name: Windows
            os: windows-latest

    steps:
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get
        
      - name: Diagnose Dart formatting
        run: |
          cp test/data/fdc_dataset_retained_visible_prune_test.dart /tmp/fdc_before.dart
          
          dart format test/data/fdc_dataset_retained_visible_prune_test.dart

          echo "=== EXACT FORMAT DIFFERENCE ==="
          diff -u /tmp/fdc_before.dart test/data/fdc_dataset_retained_visible_prune_test.dart || true

          echo "=== GIT STATUS ==="
          git status --short

      - name: Check Dart formatting
        run: |
          dart format lib test
          git diff -- test/data/fdc_dataset_retained_visible_prune_test.dart
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Run public tests
        run: flutter test

      - name: Verify package publication
        run: dart pub publish --dry-run
